modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "logo.png"
authors = "${mod_author}"
credits = "Original mod by suiyi (https://github.com/taisuiyileba/Botania-Backpack-Upgrades). NeoForge 1.21.1 port by UnnamedUser12."
description = '''${description}'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neoforge_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "sophisticatedcore"
    type = "required"
    versionRange = "${sophisticatedcore_version}"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "sophisticatedbackpacks"
    type = "required"
    versionRange = "${sophisticatedbackpacks_version}"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "botania"
    type = "required"
    versionRange = "${botania_version_range}"
    ordering = "AFTER"
    side = "BOTH"
